name: Release

# Publishes to npm when a version tag (e.g. v0.1.0) is pushed.
#
# Authentication uses npm Trusted Publishing (OIDC) - no token is involved.
# Prerequisites:
#   1. On npmjs.com: package Settings -> Trusted Publisher -> GitHub Actions,
#      with organization `balanza`, repository `pi-codetour`, and workflow
#      filename `release.yml` (exact, case-sensitive).
#   2. `repository.url` in package.json must match this repo exactly.
#   3. Node >= 22.14 with npm >= 11.5.1 (OIDC support); Node 24 satisfies both.
# Provenance is generated automatically for OIDC publishes of public packages.
#
# Note: the `id-token: write` permission below is what lets the runner mint the
# OIDC token, so it is required, not optional.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # required for npm trusted publishing (OIDC)

# The project .npmrc sets loglevel=silent so script output can be piped
# locally; keep CI logs verbose.
env:
  NPM_CONFIG_LOGLEVEL: notice

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Pi provides these at runtime (peer deps), so install them in a scratch
      # dir and symlink them in just for the type check. See ci.yml.
      - name: Provide pi host packages for typecheck
        run: |
          HOST="${RUNNER_TEMP}/pi-host"
          mkdir -p "$HOST"
          (cd "$HOST" && npm init -y >/dev/null && npm install @earendil-works/pi-coding-agent@^1)
          mkdir -p node_modules/@earendil-works
          for p in pi-coding-agent pi-tui pi-ai pi-agent-core; do
            ln -sfn "$HOST/node_modules/@earendil-works/$p" "node_modules/@earendil-works/$p"
          done
          ln -sfn "$HOST/node_modules/typebox" node_modules/typebox

      - name: Typecheck
        run: npm run typecheck

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # No NODE_AUTH_TOKEN: the npm CLI detects the OIDC environment and
      # exchanges it for a short-lived publish token by itself.
      - name: Publish to npm
        run: npm publish

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tgz
